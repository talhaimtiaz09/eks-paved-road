# Env-specific overlay that REFERENCES the GitOps repo's eks/secrets base and
# injects the two non-secret placeholders (region + Secrets Manager secret name).
# Nothing is copied — the SecretStore/ExternalSecret manifests live only in the
# GitOps repo; this overlay just patches their values.
#
# The eks-secrets ArgoCD Application (see ../apps) is repointed at THIS path so
# ArgoCD renders the patched versions.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web

resources:
  - github.com/talhaimtiaz09/argocd-gitops-config//eks/secrets?ref=main

patches:
  # REPLACE_ME_AWS_REGION -> region
  - target:
      kind: SecretStore
      name: aws-secrets-manager
    patch: |-
      - op: replace
        path: /spec/provider/aws/region
        value: us-east-1

  # REPLACE_ME_SECRET_NAME -> Secrets Manager secret name (both data entries)
  - target:
      kind: ExternalSecret
      name: web-db-credentials
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: eks-paved-road/dev/web-db-credentials
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: eks-paved-road/dev/web-db-credentials
